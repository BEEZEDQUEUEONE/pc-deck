[package]
name = "pc-deck"
version = "0.2.0"
edition = "2021"
description = "Local Windows dashboard for CPU, GPU, temperatures, disks, Docker and sites."
license = "LicenseRef-Proprietary"

[dependencies]
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.3"
tao = "0.37.2"
wry = "0.57.2"
zip = "9.6.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
